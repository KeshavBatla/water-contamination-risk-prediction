<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Contamination Risk Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌊 Water Contamination Risk Predictor</h1>
            <p>Predict the likelihood of water contamination in the next 3 hours based on sensor readings</p>
        </header>

        <!-- Data Source Controls -->
        <div class="data-controls">
            <div id="dataSourceInfo" class="data-info">
                <small>Using data from: <span id="dataTimestamp"></span></small>
            </div>

            <!-- Risk Scenario Control -->
            <label class="scenario-label">
                <input type="checkbox" id="riskScenarioCheckbox">
                Show High-Risk Scenario
            </label>
        </div>

        <!-- Sensor Display -->
        <section id="sensorDisplay" class="sensor-section">
            <h2>Current Sensor Readings</h2>
            <div id="sensorGrid" class="sensor-grid">
                <!-- Sensor cards will be injected here by JavaScript -->
            </div>
        </section>

        <!-- Prediction Button -->
        <button type="button" id="predictBtn" class="predict-button">
            Predict Contamination Risk
        </button>

        <!-- Result Section -->
        <section id="resultSection" class="result-section hidden">
            <h2>Prediction Result</h2>
            <div id="resultContent">
                <div id="riskDisplay"></div>
                <div id="probabilityDisplay"></div>
                <div id="messageDisplay"></div>
            </div>
        </section>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <p>Analyzing water quality data...</p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
